	xmlns:xlink="http://www.w3.org/1999/xlink">
	<style>
path,ellipse{
  fill: none;
  stroke-width:3px;
}
text{
  text-anchor: middle;
  dominant-baseline: central;
}
.hd{
  font-size: 24px;
  font-weight: bold;
}
.ln{
  stroke:#88F;
}
.rd{
stroke: #F00;
}
.gr{
stroke: #0B3;
}
	</style>
	<defs>
		<circle id="nd" r="20" fill="#FFF" stroke="#000" stroke-width="3px" />
		<g id="lf">
			<use xlink:href="#nd"/>
			<text font-size="22px">Id</text>
		</g>
	</defs>
	<g id="tr">
		<path d="M150 30 L150 90" class="ln"/>
		<path d="M150 30 L70 90" class="ln"/>
		<path d="M150 30 L230 90" class="ln"/>
		<path d="M150 90 L150 160" class="ln"/>
		<path d="M70 90 L60 160" class="ln"/>
		<path d="M230 90 L240 160" class="ln"/>
