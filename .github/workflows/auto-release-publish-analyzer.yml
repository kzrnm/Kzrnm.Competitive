name: Auto release publish analyzer

on:
  push:
    branches:
      - main
    paths:
      - "Analyzer/**"
      - .github/workflows/auto-release-publish-analyzer.yml
  workflow_dispatch:
    inputs:
      force-release:
        type: boolean
        default: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip
  WORKFLOW_BUILD_SLN: Analyzer/Competitive.Analyzer.slnx
  PACK_CSPROJ: Analyzer/Kzrnm.Competitive.Analyzer/Kzrnm.Competitive.Analyzer.csproj

jobs:
  get-version:
    uses: kzrnm/dotnet-actions/.github/workflows/get-version.yml@v2
    with:
      project-path: Analyzer/Kzrnm.Competitive.Analyzer/Kzrnm.Competitive.Analyzer.csproj
      prefix: Analyzer-v

  format:
    uses: kzrnm/dotnet-actions/.github/workflows/format.yml@v2
    with:
      target: Analyzer/Competitive.Analyzer.slnx
      dotnet-version: |
            9.0.x
            10.0.x

  build:
    runs-on: ubuntu-latest
    needs: [get-version]
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Build
        run: dotnet build ${{ env.WORKFLOW_BUILD_SLN }} -c Release
      - name: Test
        run: dotnet test --solution ${{ env.WORKFLOW_BUILD_SLN }} --no-build -c Release
        timeout-minutes: 10
      - name: Pack
        run: dotnet pack ${{ env.PACK_CSPROJ }} --no-build -c Release -o Analyzer/bin/Packages/Release
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: Analyzer/bin/Packages/Release

  publish:
    runs-on: ubuntu-latest
    needs: [get-version, build, format]
    if: ${{ needs.get-version.outputs.is-new == 'true' }}
    permissions:
      id-token: write
      contents: write
    steps:
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: naminodarie
      - name: Publish NuGet & Release
        uses: kzrnm/dotnet-actions/actions/publish@v2
        id: get-version
        with:
          artifact-name: dist
          version: ${{ needs.get-version.outputs.version }}
          is-prerelease: ${{ needs.get-version.outputs.is-prerelease == 'true' }}
          NUGET_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          tag-prefix: Analyzer-v
          release-name-prefix: "Analyzer: Version "
          makeLatest: "false"